name: Release

on:
  push:
    branches:
      - 'master'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.9.14
        with:
          versionSpec: "5.x"
      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.9.14
        with:
          useConfigFile: true
      - name: Create Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.gitversion.outputs.majorMinorPatch }}
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: gh release create "$RELEASE_VERSION" --title "$RELEASE_VERSION - $RELEASE_COMMIT_MESSAGE" --generate-notes --target "$GITHUB_SHA"
